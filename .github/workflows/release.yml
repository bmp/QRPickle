name: Auto-Build and Release

on:
  # Release only when a version tag is pushed (git tag v0.1.12 && git push origin v0.1.12),
  # never on every push to main (review 6.1). See docs/RELEASING.md.
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  pages: write      # publish Cloud OTA files + web installer to GitHub Pages
  id-token: write   # required by actions/deploy-pages

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from Source
        run: |
          VERSION=$(grep 'FW_VERSION' src/core/metadata.h | cut -d'"' -f2)
          echo "Extracted Version: $VERSION"
          echo "FW_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Tag must match FW_VERSION
        run: |
          if [ "${GITHUB_REF_NAME}" != "${FW_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != FW_VERSION ${FW_VERSION} in src/core/metadata.h"; exit 1
          fi

      - name: Capture Commit Message for Release Notes
        run: |
          EOF_DELIM=$(openssl rand -hex 8)
          echo "CHANGELOG<<$EOF_DELIM" >> $GITHUB_ENV
          git log -1 --pretty=%B >> $GITHUB_ENV
          echo "$EOF_DELIM" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO & Build Binaries
        run: |
          pip install "platformio==6.2.0"
          pio test -e native
          pio run
          pio run -t buildfs

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Package Assets
        run: |
          mkdir -p staging_release
          CURRENT_DATE=$(date +'%Y-%m-%d')
          REPO_NAME="${{ github.repository }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          echo "# QRPickle Field Manual & System Documentation" > metadata_header.md
          echo "" >> metadata_header.md
          echo "| Project Property | System Specification |" >> metadata_header.md
          echo "| :--- | :--- |" >> metadata_header.md
          echo "| **Firmware Package** | QRPickle Tracker Dashboard |" >> metadata_header.md
          echo "| **Software Version** | ${{ env.FW_VERSION }} |" >> metadata_header.md
          echo "| **Compilation Date** | ${CURRENT_DATE} |" >> metadata_header.md
          echo "| **Target Hardware** | ESP32 Cheap Yellow Display (CYD) |" >> metadata_header.md
          echo "| **Source Repository** | [${REPO_NAME}](${REPO_URL}) |" >> metadata_header.md
          echo "| **Primary License** | MIT License |" >> metadata_header.md
          echo "" >> metadata_header.md
          echo "---" >> metadata_header.md
          echo "" >> metadata_header.md

          cat metadata_header.md README.md > temp_doc.md
          pandoc temp_doc.md -o temp_doc.typ
          sed -i 's/#horizontalrule/#line(length: 100%, stroke: 0.5pt)/g' temp_doc.typ
          typst compile temp_doc.typ "staging_release/QRPickle_Documentation_${{ env.FW_VERSION }}.pdf"

          find .pio/build/ -name "*.bin" -exec cp {} staging_release/ \;
          # All five flash images as separate assets: the installer's version list downloads them.
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin staging_release/
          # Licence texts travel with the binaries (the fonts' OFL requires it).
          cp License THIRD_PARTY_NOTICES.md assets/fonts/OFL-*.txt staging_release/
          # Checksum for manual verification (devices read theirs from ota.json on Pages).
          sha256sum staging_release/firmware.bin | cut -d' ' -f1 > staging_release/firmware.bin.sha256
          zip -j "QRPickle_Release_${{ env.FW_VERSION }}.zip" staging_release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FW_VERSION }}
          body: |
            ### 📝 Latest Changes in this Build:
            ${{ env.CHANGELOG }}
          files: |
            QRPickle_Release_${{ env.FW_VERSION }}.zip
            staging_release/firmware.bin
            staging_release/firmware.bin.sha256
            staging_release/littlefs.bin
            staging_release/bootloader.bin
            staging_release/partitions.bin
            staging_release/boot_app0.bin

      # GitHub Pages: ota/ (Cloud OTA: ota.json + firmware.bin; review 2.9) and install/ (ESP Web
      # Tools one-click installer). Notes go through a file so commit text never reaches a shell.
      # Earlier releases for the installer's version list (make_pages_site.py keeps v0.2.0+, newest 5).
      - name: Download previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release list --limit 30 --json tagName -q '.[].tagName' | while read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [ "$tag" = "$FW_VERSION" ] && continue
            mkdir -p "previous/$tag"
            if gh release download "$tag" -D "previous/$tag" -p bootloader.bin -p partitions.bin \
                 -p boot_app0.bin -p firmware.bin -p littlefs.bin; then
              gh release view "$tag" --json body -q .body > "previous/$tag/notes.txt"
            else
              rm -rf "previous/$tag"   # releases before v0.2.0 lack some files
            fi
          done

      - name: Build Pages site
        run: |
          git log -1 --pretty=%B > release_notes.txt
          python3 scripts/make_pages_site.py --build-dir .pio/build/cyd --out site \
            --version "$FW_VERSION" --notes-file release_notes.txt --previous-dir previous

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
