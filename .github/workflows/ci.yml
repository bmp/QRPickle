name: CI

# Checks every push and pull request. Never publishes anything: releases are created only by
# release.yml when a version tag is pushed (see docs/RELEASING.md).
on:
  push:
    branches: ["**"]
  pull_request:

# Read-only: CI only checks code; it never needs to write to the repository.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-26.04   # pinned; scripts/dev.sh runs the same Ubuntu (--ubuntu 24.04 still works)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the format check compares against the base commit

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'   # pioarduino (core 3) needs <= 3.14

      - name: Install PlatformIO and linters (pinned)
        run: pip install "platformio==6.2.0" "clang-format==19.1.7" "ruff==0.16.10"

      - name: Prepare pioarduino (PlatformIO 6.2.0 in its own environment)
        # pioarduino (Arduino core 3) creates ~/.platformio/penv with a PlatformIO it then rejects
        # (6.2.0.post1); pin 6.2.0 there. See docs/DEVELOPMENT.md.
        run: |
          pio pkg install -e cyd
          PENV="$HOME/.platformio/penv"
          "$PENV/bin/uv" pip install -p "$PENV/bin/python" "platformio==6.2.0"
          "$PENV/bin/pio" --version

      - name: Python lint (ruff)
        run: ruff check

      - name: Space feed builder tests
        run: |
          pip install "pyyaml==6.0.2"  # the source list (tools/space_feed/sources.yaml)
          python3 -m unittest discover -s tools/space_feed

      - name: Image converter tests (Python and the web console's JS)
        run: |
          pip install pillow
          python3 -m unittest scripts/test_png_to_bin_lvgl9.py
          node test/js/logo_test.mjs
          node test/js/install_plan_test.mjs
          python3 -m unittest scripts/test_make_pages_site.py
          python3 -m unittest scripts/test_source_tables.py
          python3 -m unittest scripts/test_data_flow.py

      - name: Data-flow doc matches the code (docs/DATA_FLOW.md vs src/services/sources.h)
        run: python3 scripts/check_data_flow.py

      - name: Release notes exist for FW_VERSION (CHANGELOG.md)
        run: python3 scripts/release_notes.py "$(grep FW_VERSION src/core/metadata.h | cut -d'"' -f2)" > /dev/null

      # Only lines changed by this push / PR must follow .clang-format (no mass reformat).
      - name: C++ format of changed lines (clang-format)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          scripts/check_format.sh "$BASE"

      - name: Native unit tests
        run: pio test -e native

      - name: Static analysis (cppcheck)
        run: pio check -e cyd --severity=high --severity=medium --fail-on-defect=medium

      - name: Release firmware + filesystem (size and secret guards run as build scripts)
        run: |
          pio run -e cyd 2>&1 | tee build.log
          pio run -e cyd -t buildfs
          # No compiler warnings in QRPickle's own code (libraries and the framework are excluded).
          if grep -E "^(src|include|test)/[^:]+:[0-9]+:[0-9]+: warning:" build.log; then
            echo "::error::compiler warnings in src/ (listed above)"; exit 1
          fi

      - name: Debug firmware still builds
        run: pio run -e cyd-debug
