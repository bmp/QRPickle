name: CI

# Checks every push and pull request. Never publishes anything: releases are created only by
# release.yml when a version tag is pushed (see docs/RELEASING.md).
on:
  push:
    branches: ["**"]
  pull_request:

# Read-only: CI only checks code; it never needs to write to the repository.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO (pinned)
        run: pip install "platformio==6.2.0"

      - name: Native unit tests
        run: pio test -e native

      - name: Static analysis (cppcheck)
        run: pio check -e cyd --severity=high --severity=medium --fail-on-defect=medium

      - name: Release firmware + filesystem (size and secret guards run as build scripts)
        run: |
          pio run -e cyd
          pio run -e cyd -t buildfs

      - name: Debug firmware still builds
        run: pio run -e cyd-debug
