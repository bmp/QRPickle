; ==============================================================================
; QRPickle Project Global Configuration
; Sets the default target firmware environment to the CYD board module
; ==============================================================================
[platformio]
default_envs = cyd

; Flags shared by cyd and cyd-debug. CORE_DEBUG_LEVEL is set once per env: PlatformIO keeps
; the FIRST definition of a duplicated -D macro, so overriding it with -U/-D does not work.
[common]
build_flags =
    -DUSER_SETUP_LOADED=1
    -include "src/hw/User_Setup.h"
    -DLV_CONF_PATH=\"${PROJECT_DIR}/include/lv_conf.h\"
    ; AsyncTCP's task stack: 16 KB by default, ~4.3 KB used at most (browser e2e test, mem_stats,
    ; 2026-10-11). 8 KB returns 8 KB of heap for TLS (docs/MEMORY.md).
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192

; ==============================================================================
; Target Environment: Cheap Yellow Display (CYD) Firmware Pipeline
; Configures ESP32 flashing speeds, dependencies (LVGL v9), and pre/post scripts
; ==============================================================================
[env:cyd]
platform              = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; Arduino core 3.3.12 / ESP-IDF 5.5. Measured on the CYD (docs/PLATFORM_SPIKE.md): each line saves heap
; or flash. IPv6 must stay (esp-modbus and others need it); the certificate bundle can't be off
; (NetworkClientSecure includes it), so it uses the smaller common set.
custom_sdkconfig =
    CONFIG_BT_ENABLED=n
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=6
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=16
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=16
    CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
    CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=3072
    CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE=2304
    CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y
    CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
    CONFIG_ESP_ERR_TO_NAME_LOOKUP=n
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=y
    CONFIG_LWIP_PPP_SUPPORT=n
    CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
; Bundled components QRPickle never uses.
custom_component_remove =
    espressif/esp-modbus
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp-dsp
    espressif/esp_modem
    espressif/libsodium
    espressif/network_provisioning
    espressif/qrcode
    espressif/cbor
    espressif/lan867x
    espressif/esp_schedule
    espressif/fb_gfx
    chmorgan/esp-libhelix-mp3
board                 = esp32dev
framework             = arduino
board_build.partitions= partitions.csv
board_build.filesystem= littlefs
monitor_speed         = 115200
upload_speed          = 921600

; Project Application Library Dependencies
; Pinned to the versions verified on hardware (review 6.2). Bump deliberately.
lib_deps =
    lvgl/lvgl @ 9.6.0
    bodmer/TFT_eSPI @ 2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
    bblanchon/ArduinoJson @ 7.4.3
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    adafruit/Adafruit BME280 Library @ 2.3.0
    adafruit/Adafruit Unified Sensor @ 1.1.15
    hopperpop/Sgp4 @ 1.0.3   ; satellite passes (MIT; SGP4 code by D. Vallado)

; Compilation Build Flags:
; - CORE_DEBUG_LEVEL=1: errors only. Level 4 logged full HTTP URLs incl. the OpenWeather key
;   (review 3.5b) and costs ~14 KB flash; use the cyd-debug env for verbose logs.
;   See docs/DEBUGGING.md.
; - USER_SETUP_LOADED=1: Informs TFT_eSPI to use an external configurations file
; - include: Directs the compiler to inject your custom hardware header file
; - LV_CONF_PATH: Explicitly points the engine to your LVGL configuration path
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=1
; Warnings for QRPickle's own sources only (libraries and the framework keep their flags).
; CI fails on any warning in src/ (ci.yml).
build_src_flags = -Wall -Wextra

; Python Automation Scripts for Assets Gzip, Secret Checks, and Binary Sizing
extra_scripts =
    pre:scripts/gzip_data.py
    pre:scripts/check_secrets.py
    pre:scripts/check_licenses.py
    pre:scripts/check_lvgl_usage.py
    post:scripts/check_size.py
    post:scripts/release_copy.py

; Static analysis: `pio check -e cyd`. Framework packages are skipped; ArduinoJson's
; namespace macros are a known cppcheck false positive (preprocessorErrorDirective).
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --suppress=preprocessorErrorDirective:*ArduinoJson*

; ==============================================================================
; Target Environment: Verbose debug build (never release this build)
; Same as cyd, with full framework logging (CORE_DEBUG_LEVEL=4). See docs/DEBUGGING.md.
; ==============================================================================
[env:cyd-debug]
extends     = env:cyd
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=4

; Screenshot build for tools/device_screens.py (docs/DEBUGGING.md). Never release it:
; it adds /api/debug/* routes (screens and screenshots over WiFi).
[env:cyd-screens]
extends     = env:cyd
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DQRP_SCREEN_TOOLS

; ==============================================================================
; Target Environment: Native Desktop Unit Testing
; Executes localized parsing, scheduling, and configuration verification logic
; ==============================================================================
[env:native]
platform        = native
test_framework  = unity
build_flags     = -std=c++17 -DUNIT_TEST
lib_deps        = bblanchon/ArduinoJson @ 7.4.3   ; header-only; test_config uses config_json
; One pattern per line (space-separated values are read as a single pattern).
test_filter     =
    test_parsers
    test_config
    test_led
; Host-testable sources only (no Arduino/FreeRTOS dependencies)
test_build_src  = yes
build_src_filter = -<*> +<services/sota_cluster_parse.cpp> +<services/solar_parse.cpp> +<services/sun_calc.cpp> +<services/band_rating.cpp> +<services/hamalert_parse.cpp> +<services/space_parse.cpp> +<core/logo_file.cpp> +<services/dx_status_text.cpp>
